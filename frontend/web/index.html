<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>痒痒鼠解放双手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>痒痒鼠解放双手</h1>
  <nav class="tabs" id="tabNav">
    <button class="tab active" data-tab="tabControl">📋 控制面板</button>
    <button class="tab" data-tab="tabConfig">⚙ 参数配置</button>
    <button class="tab" data-tab="tabTemplates">🎯 模板管理</button>
  </nav>
</header>

<main>

  <!-- ==================== Tab 1: 控制面板 ==================== -->
  <div class="tab-content active" id="tabControl">
    <div class="section-header">
      <span>Bot 实例</span>
      <button id="btnAddInstance" class="btn btn-sm">＋ 添加窗口</button>
    </div>
    <div id="instancesContainer" class="instances-grid">
      <!-- 动态生成 -->
    </div>
  </div>

  <!-- ==================== Tab 2: 参数配置 ==================== -->
  <div class="tab-content" id="tabConfig">
    <div class="cfg-scroll">
      <details class="cfg-group" open>
        <summary>📁 屏幕 & 匹配</summary>
        <div class="cfg-row">
          <label>匹配阈值</label>
          <input id="cfgThreshold" type="number" class="cfg-input cfg-num" min="0.1" max="1.0" step="0.05">
          <span class="cfg-hint" title="cv2.matchTemplate 最低匹配分数。值越高越严格，越低越容易误识别">🛈</span>
        </div>
        <div class="cfg-row">
          <label>识图缩放</label>
          <input id="cfgDetectScale" type="number" class="cfg-input cfg-num" min="0.1" max="1.0" step="0.1">
          <span class="cfg-hint" title="截屏后缩放到此比例再匹配。越小越快但越不精确。⚠ 不推荐修改">🛈 ⚠</span>
        </div>
        <div class="cfg-row">
          <label>消抖帧数</label>
          <input id="cfgMatchConfirm" type="number" class="cfg-input cfg-num" min="1" max="5" step="1">
          <span class="cfg-hint" title="需连续 N 帧匹配到同一目标才触发点击。越大越稳定但响应越慢">🛈</span>
        </div>
      </details>

      <details class="cfg-group" open>
        <summary>🖱 鼠标 & 点击</summary>
        <div class="cfg-row">
          <label>移动速度(最小)</label>
          <input id="cfgMouseMin" type="number" class="cfg-input cfg-num" min="100" max="10000" step="100">
          <span class="cfg-hint" title="pyautogui 鼠标移动速度下限（像素/秒）">🛈</span>
        </div>
        <div class="cfg-row">
          <label>移动速度(最大)</label>
          <input id="cfgMouseMax" type="number" class="cfg-input cfg-num" min="100" max="10000" step="100">
          <span class="cfg-hint" title="pyautogui 鼠标移动速度上限（像素/秒），实际速度在此区间随机">🛈</span>
        </div>
      </details>

      <details class="cfg-group" open>
        <summary>⚔ 战斗参数</summary>
        <div class="cfg-row">
          <label>每打N把休息</label>
          <input id="cfgRestRounds" type="number" class="cfg-input cfg-num-sm" min="0" max="9999" step="1">
          <span>±</span>
          <input id="cfgRestRoundsVar" type="number" class="cfg-input cfg-num-sm" min="0" max="500" step="1">
          <span class="cfg-hint" title="每打N把触发一次休息，±误差范围使每次休息间隔随机变化（设为0关闭休息）">🛈</span>
        </div>
        <div class="cfg-row">
          <label>休息时长(秒)</label>
          <input id="cfgRestSeconds" type="number" class="cfg-input cfg-num-sm" min="1" max="3600" step="1">
          <span>±</span>
          <input id="cfgRestSecondsVar" type="number" class="cfg-input cfg-num-sm" min="0" max="3600" step="1">
          <span class="cfg-hint" title="每次休息的时长，±误差范围使每次休息时间随机变化">🛈</span>
        </div>
        <div class="cfg-row">
          <label>连续未匹配上限</label>
          <input id="cfgMissThreshold" type="number" class="cfg-input cfg-num-sm" min="5" max="200" step="5">
          <span class="cfg-hint" title="连续 N 次未匹配到图片后，延时重试（最多3轮），减少无效扫描">🛈</span>
        </div>
        <div class="cfg-row">
          <label>未匹配延时(秒)</label>
          <input id="cfgMissRetrySleep" type="number" class="cfg-input cfg-num-sm" min="0.5" max="30" step="0.5">
          <span class="cfg-hint" title="触发未匹配上限后的等待时间，避免频繁无效扫描">🛈</span>
        </div>
      </details>

      <details class="cfg-group">
        <summary>🖥 屏幕区域</summary>
        <div class="cfg-row">
          <label>X 范围</label>
          <input id="cfgScrXmin" type="number" class="cfg-input cfg-num cfg-num-sm" min="0" max="7680" step="1" placeholder="Xmin">
          <span>~</span>
          <input id="cfgScrXmax" type="number" class="cfg-input cfg-num cfg-num-sm" min="0" max="7680" step="1" placeholder="Xmax">
          <span class="cfg-hint" title="限定截屏区域 X 轴范围（像素），0 表示屏幕左边缘">🛈</span>
        </div>
        <div class="cfg-row">
          <label>Y 范围</label>
          <input id="cfgScrYmin" type="number" class="cfg-input cfg-num cfg-num-sm" min="0" max="4320" step="1" placeholder="Ymin">
          <span>~</span>
          <input id="cfgScrYmax" type="number" class="cfg-input cfg-num cfg-num-sm" min="0" max="4320" step="1" placeholder="Ymax">
          <span class="cfg-hint" title="限定截屏区域 Y 轴范围（像素），0 表示屏幕顶部边缘">🛈</span>
        </div>
      </details>

      <div class="cfg-actions">
        <button id="btnSaveCfg" class="btn btn-primary">💾 保存全局配置</button>
        <button id="btnResetCfg" class="btn">↩ 恢复默认</button>
      </div>
    </div>
  </div>

  <!-- ==================== Tab 3: 模板管理 ==================== -->
  <div class="tab-content" id="tabTemplates">
    <div class="section-header">
      <span>场景选择</span>
      <div class="scene-actions">
        <select id="selScene" class="cfg-input cfg-select"></select>
        <button id="btnNewScene" class="btn btn-sm">＋ 新建场景</button>
        <button id="btnDelScene" class="btn btn-sm btn-danger">🗑 删除场景</button>
      </div>
    </div>

    <!-- baseline 基准图 -->
    <div class="baseline-card" id="baselineCard">
      <div class="baseline-info">
        <span>📐 窗口基准图：</span>
        <span id="baselineStatus" class="baseline-status missing">未设置</span>
        <span id="baselineSize" class="baseline-size"></span>
      </div>
      <div class="baseline-hint">
        上传一张游戏窗口的完整截图作为「基准」。模板截图就是在这个窗口大小下截的，
        运行时如果窗口大小变了，程序会自动缩放模板来适配。
      </div>
      <div class="baseline-actions">
        <button id="btnCaptureBaseline" class="btn btn-sm">📷 截取全屏</button>
        <span class="baseline-or">或</span>
        <button id="btnImportBaseline" class="btn btn-sm">📁 导入本地</button>
      </div>
      <input type="file" id="baselineImportInput" accept="image/*" style="display:none">
    </div>

    <div class="templates-dual">
      <!-- begin -->
      <div class="tpl-col">
        <h3>begin 模板</h3>
        <div id="tplBegin" class="tpl-grid"></div>
        <div class="tpl-actions">
          <button class="btn btn-sm" onclick="startCapture('begin')">📷 截取模板</button>
          <button class="btn btn-sm" onclick="importLocal('begin')">📁 导入本地</button>
        </div>
      </div>
      <!-- end -->
      <div class="tpl-col">
        <h3>end 模板</h3>
        <div id="tplEnd" class="tpl-grid"></div>
        <div class="tpl-actions">
          <button class="btn btn-sm" onclick="startCapture('end')">📷 截取模板</button>
          <button class="btn btn-sm" onclick="importLocal('end')">📁 导入本地</button>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- 隐藏的文件上传 input -->
<input type="file" id="fileImport" accept="image/*" style="display:none">

<script type="text/javascript" src="/eel.js"></script>
<script src="app.js"></script>
</body>
</html>
